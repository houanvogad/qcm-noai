<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entraînement aux Olympiades d’IA : QCM</title>
<meta name="description" content="200 QCM corrigés pour s’entraîner aux Olympiades d’IA : algorithmique, Python et mathématiques. Gratuit, sans inscription.">
<meta name="theme-color" content="#10294f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta property="og:type" content="website"><meta property="og:locale" content="fr_FR"><meta property="og:site_name" content="Entraînement NOAI">
<meta property="og:title" content="200 QCM pour s’entraîner aux Olympiades d’IA">
<meta property="og:description" content="Algorithmique, Python et maths : questions corrigées une à une, gratuit, sans inscription. Réalisé par Kpèmahuton Gadiël HOUANVO.">
<meta property="og:url" content="https://houanvogad.github.io/qcm-noai/">
<meta property="og:image" content="https://houanvogad.github.io/qcm-noai/og-image.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--mut:#5b6b82;--line:#d9e1ec;--pri:#10294f;--acc:#1e8c7a;--ok:#17724a;--okbg:#e2f4ea;--ko:#b3261e;--kobg:#fbe9e7;--code:#eef1f5;--sel:#e3ecfa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1524;--card:#16213a;--ink:#e8eefb;--mut:#9fb0cc;--line:#2a3a5c;--pri:#8fb4ff;--acc:#4cc9b0;--ok:#6fdca0;--okbg:#12342a;--ko:#ff9b92;--kobg:#3a1c1c;--code:#0f1a30;--sel:#1f3358}}
:root[data-theme="dark"]{--bg:#0d1524;--card:#16213a;--ink:#e8eefb;--mut:#9fb0cc;--line:#2a3a5c;--pri:#8fb4ff;--acc:#4cc9b0;--ok:#6fdca0;--okbg:#12342a;--ko:#ff9b92;--kobg:#3a1c1c;--code:#0f1a30;--sel:#1f3358}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.5rem;margin:.2em 0;color:var(--pri)}h2{font-size:1.15rem;margin:.6em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:600;margin:10px 0 4px}select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--bg);font-size:1rem;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}
:root:not([data-theme="dark"]) .btn{color:#fff}
.top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--mut)}
.tag{font-weight:700;color:var(--acc)}.bar{height:6px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
pre{background:var(--code);padding:12px;border-radius:10px;overflow-x:auto;font:.9rem/1.45 ui-monospace,Consolas,Menlo,monospace;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt b{min-width:1.6em;height:1.6em;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.85rem}
.opt.sel{border-color:var(--pri);background:var(--sel)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ko{border-color:var(--ko);background:var(--kobg)}.opt.dim{opacity:.55}
.fb{border-radius:12px;padding:12px;margin:10px 0}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ko{background:var(--kobg);color:var(--ko)}.fb p{margin:.3em 0;color:var(--ink)}
.score{font-size:2.6rem;font-weight:800;color:var(--pri);margin:0}table{width:100%;border-collapse:collapse;margin:8px 0}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.err{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}a.btn{text-align:center;text-decoration:none}.by{color:var(--mut);margin-top:-6px}.note,footer{color:var(--mut);font-size:.85rem}footer{text-align:center;padding:10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}#ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center}.sheet img{background:#fff;padding:8px;border-radius:8px}
@media print{:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#bbb;--pri:#10294f;--acc:#1e6f60;--ok:#17724a;--okbg:#fff;--ko:#b3261e;--kobg:#fff;--code:#f1f1f1;--sel:#fff}.btn,#ov,.noprint{display:none!important}body{background:#fff}.card{border:1px solid #ccc;break-inside:avoid}pre{white-space:pre-wrap}.err{break-inside:avoid}}
</style></head><body><main id="app"></main><div id="ov" hidden></div><footer>Réalisé par <strong>Kpèmahuton Gadiël HOUANVO</strong>, technopédagogue (Bénin)<br>Entraînement non officiel, questions originales. Bon courage pour les Olympiades d’IA !</footer>
<script src="questions.js"></script>
<script>
(function(){
var D=window.QCM_DATA,META=window.QCM_META,SEC={A:"Algorithmique",B:"Python",C:"Mathématiques"},app=document.getElementById("app");
var AUTHOR="Kpèmahuton Gadiël HOUANVO",CONTACT={whatsapp:"+2290161825610",email:"houanvogad@gmail.com",linkedin:"https://www.linkedin.com/in/houanvogad",facebook:"https://www.facebook.com/profile.php?id=61586805663951"};
function contact(){var c=CONTACT,l=[];if(c.whatsapp)l.push(["WhatsApp","https://wa.me/"+c.whatsapp.replace(/\D/g,"")]);if(c.email)l.push(["E-mail","mailto:"+c.email]);if(c.linkedin)l.push(["LinkedIn",c.linkedin]);if(c.facebook)l.push(["Page Facebook",c.facebook]);
 if(!l.length)return"";return'<section class="card noprint"><h2>Me contacter</h2><p>Une question, une idée de collaboration ? Écris-moi directement.</p><p><strong>'+AUTHOR+'</strong></p>'+l.map(function(x){return'<a class="btn alt" target="_blank" rel="noopener" href="'+x[1]+'">'+x[0]+'</a>'}).join("")+'</section>'}
var cfg={qcm:"all",sec:"all",mode:"train",shuf:true},items=[],i=0,t0=0,tid=null,deferred=null,SITE="https://houanvogad.github.io/qcm-noai/";
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function shuf(a){for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function pool(){return D.filter(function(q){return(cfg.qcm==="all"||String(q.qcm)===cfg.qcm)&&(cfg.sec==="all"||q.sec===cfg.sec)})}
function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+":"+("0"+m).slice(-2):m)+":"+("0"+s).slice(-2)}
function tick(){var e=document.getElementById("chr");if(e)e.textContent=fmt(Date.now()-t0)}
function qcmOpts(){var ks=Object.keys(META.series),h='<option value="all">Toutes les séries ('+D.length+' questions)</option>';
 ks.forEach(function(k){h+='<option value="'+k+'">'+META.series[k]+' ('+D.filter(function(q){return String(q.qcm)===k}).length+' questions)</option>'});return h}
function closeShare(){document.getElementById("ov").hidden=true}
function share(){
 var ov=document.getElementById("ov"),txt="Entraîne-toi pour les Olympiades d’IA avec "+D.length+" QCM corrigés, gratuits : "+SITE;
 ov.innerHTML='<div class="sheet" role="dialog" aria-label="Partager"><h2>Partager ce test</h2><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">Envoyer sur WhatsApp</a>'+
  (navigator.share?'<button class="btn alt" id="sh-n">Partager…</button>':"")+'<button class="btn alt" id="sh-c">Copier le lien</button>'+(deferred?'<button class="btn alt" id="sh-i">Installer l’application</button>':"")+
  '<p class="note">QR code à scanner ou à afficher en classe :</p><img src="qr-code.png" alt="QR code du test" width="180" height="180"><p class="note">'+SITE+'</p><p class="note">Sur iPhone : touchez Partager, puis « Sur l’écran d’accueil », pour installer l’application.</p><button class="btn alt" id="sh-x">Fermer</button></div>';
 ov.hidden=false;
 ov.onclick=function(e){if(e.target===ov)closeShare()};
 document.getElementById("sh-x").onclick=closeShare;
 document.getElementById("sh-c").onclick=function(){var b=this;function ok(){b.textContent="Lien copié ✔"}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(SITE).then(ok,function(){prompt("Copiez ce lien :",SITE)});else prompt("Copiez ce lien :",SITE)};
 var n=document.getElementById("sh-n");if(n)n.onclick=function(){navigator.share({title:"QCM Olympiades d’IA",text:txt,url:SITE}).catch(function(){})};
 var ins=document.getElementById("sh-i");if(ins)ins.onclick=function(){deferred.prompt();deferred=null;closeShare()};
}
function menu(){
 clearInterval(tid);var best="";try{var b=JSON.parse(localStorage.getItem("noai-best")||"{}");var v=b[cfg.qcm+cfg.sec];if(v!=null)best=" Meilleur score pour ce choix : "+v+" %."}catch(e){}
 app.innerHTML='<h1>Entraînement aux Olympiades d’IA</h1><p>'+D.length+' QCM corrigés : algorithmique, Python, maths.</p><p class="by">Réalisé par <strong>'+AUTHOR+'</strong>, technopédagogue (Bénin)</p><section class="card">'+
 '<label for="s-qcm">Épreuve</label><select id="s-qcm">'+qcmOpts()+'</select>'+
 '<label for="s-sec">Domaine</label><select id="s-sec"><option value="all">Tous les domaines</option><option value="A">Algorithmique</option><option value="B">Python</option><option value="C">Mathématiques</option></select>'+
 '<label for="s-mode">Mode</label><select id="s-mode"><option value="train">Entraînement (correction immédiate)</option><option value="exam">Examen (correction à la fin)</option></select>'+
 '<label class="chk"><input type="checkbox" id="s-shuf"> Mélanger questions et réponses</label>'+
 '<button class="btn" data-a="start">Commencer (<span id="cnt"></span> questions)</button><button class="btn alt" data-a="share">Partager avec mes amis</button></section>'+
 '<p class="note" id="bst">'+best+'</p>'+contact();
 document.getElementById("s-qcm").value=cfg.qcm;document.getElementById("s-sec").value=cfg.sec;document.getElementById("s-mode").value=cfg.mode;document.getElementById("s-shuf").checked=cfg.shuf;
 document.getElementById("cnt").textContent=pool().length;
}
function start(list){
 items=list.map(function(q){var o=q.options.map(function(t,k){return{t:t,c:"ABCD"[k]===q.answer}});if(cfg.shuf)shuf(o);return{q:q,o:o,pick:null}});
 if(cfg.shuf)shuf(items);i=0;t0=Date.now();clearInterval(tid);if(cfg.mode==="exam")tid=setInterval(tick,1000);view();
}
function view(){
 var it=items[i],q=it.q,n=items.length,train=cfg.mode==="train",done=train&&it.pick!==null,sc=items.filter(function(x){return x.pick!==null&&x.o[x.pick].c}).length;
 var h='<div class="top"><span>Question '+(i+1)+' / '+n+'</span><span class="tag">'+SEC[q.sec]+' · QCM '+q.qcm+'</span><span>'+(train?"Score : "+sc:"⏱ <b id='chr'>"+fmt(Date.now()-t0)+"</b>")+'</span></div><div class="bar"><i style="width:'+(i/n*100)+'%"></i></div>';
 h+='<section class="card"><h2>'+esc(q.text)+'</h2>'+(q.code?'<pre>'+esc(q.code)+'</pre>':"");
 it.o.forEach(function(o,k){var c=done?(o.c?"ok":(k===it.pick?"ko":"dim")):(k===it.pick?"sel":"");
  h+='<button class="opt '+c+'" '+(done?"disabled ":"")+'data-a="pick" data-v="'+k+'"><b>'+"ABCD"[k]+'</b><span>'+esc(o.t)+'</span></button>'});
 if(done){var good=it.o[it.pick].c,right=it.o.filter(function(x){return x.c})[0].t;
  h+='<div class="fb '+(good?"ok":"ko")+'"><strong>'+(good?"Bonne réponse !":"Pas tout à fait.")+'</strong>'+(good?"":'<p>Bonne réponse : '+esc(right)+'</p>')+(q.ex?'<p>'+esc(q.ex)+'</p>':"")+'</div>'}
 if(it.pick!==null)h+='<button class="btn" data-a="next">'+(i<n-1?"Question suivante":"Voir mon résultat")+'</button>';
 app.innerHTML=h+'</section>';window.scrollTo(0,0);
}
function result(){
 clearInterval(tid);var dur=Date.now()-t0,n=items.length,ok=items.filter(function(x){return x.o[x.pick].c}),pct=Math.round(ok.length/n*100),by={};
 items.forEach(function(x){var s=by[x.q.sec]=by[x.q.sec]||[0,0];s[1]++;if(x.o[x.pick].c)s[0]++});
 var best="";try{var b=JSON.parse(localStorage.getItem("noai-best")||"{}"),key=cfg.qcm+cfg.sec;if(b[key]==null||pct>b[key]){b[key]=pct;localStorage.setItem("noai-best",JSON.stringify(b))}else best="Meilleur score pour ce choix : "+b[key]+" %."}catch(e){}
 var msg=pct>=80?"Excellent niveau, continue ainsi !":pct>=60?"Bon travail : consolide les notions ratées.":pct>=40?"Tu progresses : revois les corrections ci-dessous.":"Courage : refais les erreurs et relis les explications.";
 var h='<section class="card"><p class="score">'+ok.length+' / '+n+'</p><p><strong>'+pct+' %</strong> · '+msg+'</p><p class="note">'+best+'</p><p class="note">Mode '+(cfg.mode==="exam"?"Examen · Temps : "+fmt(dur)+" ("+Math.round(dur/n/1000)+" s par question)":"Entraînement")+" · "+new Date().toLocaleDateString("fr-FR")+'</p><table><tr><th>Domaine</th><th>Score</th></tr>';
 Object.keys(by).sort().forEach(function(k){h+='<tr><td>'+SEC[k]+'</td><td>'+by[k][0]+' / '+by[k][1]+'</td></tr>'});
 h+='</table>';var bad=items.filter(function(x){return!x.o[x.pick].c});
 if(bad.length)h+='<button class="btn" data-a="redo">Refaire mes '+bad.length+' erreurs</button>';
 h+='<button class="btn alt" data-a="again">Recommencer</button><button class="btn alt" data-a="print">Imprimer ou enregistrer en PDF</button><button class="btn alt" data-a="share">Partager ce test</button><button class="btn alt" data-a="menu">Retour au menu</button></section>';
 if(bad.length){h+='<section class="card"><h2>Corrections</h2>';
  bad.forEach(function(x){var r=x.o.filter(function(o){return o.c})[0].t;
   h+='<div class="err"><p class="tag">'+SEC[x.q.sec]+' · QCM '+x.q.qcm+'</p><p>'+esc(x.q.text)+'</p>'+(x.q.code?'<pre>'+esc(x.q.code)+'</pre>':"")+'<p>Ta réponse : <strong>'+esc(x.o[x.pick].t)+'</strong></p><p>Bonne réponse : <strong>'+esc(r)+'</strong></p>'+(x.q.ex?'<p class="note">'+esc(x.q.ex)+'</p>':"")+'</div>'});
  h+='</section>'}
 app.innerHTML=h+contact();window.scrollTo(0,0);
}
var act={
 start:function(){start(pool())},
 pick:function(v){items[i].pick=+v;view()},
 next:function(){if(i<items.length-1){i++;view()}else result()},
 redo:function(){start(items.filter(function(x){return!x.o[x.pick].c}).map(function(x){return x.q}))},
 again:function(){start(items.map(function(x){return x.q}))},
 menu:menu,share:share,print:function(){window.print()}
};
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
app.addEventListener("change",function(e){var t=e.target.id;
 if(t==="s-qcm")cfg.qcm=e.target.value;if(t==="s-sec")cfg.sec=e.target.value;if(t==="s-mode")cfg.mode=e.target.value;if(t==="s-shuf")cfg.shuf=e.target.checked;
 if(document.getElementById("cnt"))document.getElementById("cnt").textContent=pool().length;menu_best()});
function menu_best(){var el=document.getElementById("bst");if(!el)return;var s="";try{var b=JSON.parse(localStorage.getItem("noai-best")||"{}"),v=b[cfg.qcm+cfg.sec];if(v!=null)s="Meilleur score pour ce choix : "+v+" %."}catch(e){}el.textContent=s}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
menu();
})();
</script></body></html>
